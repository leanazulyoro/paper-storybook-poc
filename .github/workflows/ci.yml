name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the sync check reads every commit in the push/PR range
      - uses: pnpm/action-setup@v4 # version from package.json packageManager
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Paper config is valid
        run: node scripts/paper-config.mjs
      - name: Story tests (render + play functions, headless Chromium)
        run: |
          pnpm --filter @poc/ui exec playwright install --with-deps chromium
          pnpm test
      - name: Paper syncs touch only Paper-synced files
        run: node scripts/check-sync-commits.mjs "$BASE" "$HEAD"
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
